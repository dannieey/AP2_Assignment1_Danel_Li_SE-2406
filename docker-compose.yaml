services:
  order-db:
    image: postgres:15
    container_name: order-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: order_db
    ports:
      - "5431:5432"

  payment-db:
    image: postgres:15
    container_name: payment-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: payment_db
    ports:
      - "5432:5432"